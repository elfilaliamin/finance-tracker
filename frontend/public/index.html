<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance Tracker</title>

<!-- Tailwind (Play CDN — fine for local/dev use) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#4F46E5',600:'#4338CA',700:'#3730A3' } } } }
  }
</script>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<!-- React 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Babel standalone (in-browser JSX transform — no build step needed) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Chart.js for all charts (line/bar/pie/doughnut/area/stacked) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>

<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 4px; }
  .skeleton { background: linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
  @keyframes sk { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
  <div id="root"></div>

  <script type="text/babel" src="i18n.js?v=4"></script>
  <script type="text/babel" src="api.js?v=4"></script>
  <script type="text/babel" src="components.js?v=4"></script>
  <script type="text/babel" src="app.js?v=4"></script>
</body>
</html>
